# Local Postgres for workstation runtime (WSL2 / Docker Desktop).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol
      POSTGRES_DB: solpump
    ports:
      - "5432:5432"
    volumes:
      - solpump_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d solpump"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solpump_pgdata:
