# Local Postgres for workstation runtime (WSL2 / Docker Desktop).
services:
  postgres:
    image: postgres:16
    # Default Docker /dev/shm is only 64MB — too small for Postgres parallel
    # operations (VACUUM, large joins/sorts) under this workload, which fails with
    # "No space left on device". 1GB removes that hidden constraint.
    shm_size: 1gb
    environment:
      POSTGRES_USER: sol
      POSTGRES_PASSWORD: sol
      POSTGRES_DB: solpump
    ports:
      - "5432:5432"
    volumes:
      - solpump_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sol -d solpump"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  solpump_pgdata:
